<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopilot — Swap Tool</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
const orderId = param("order");
const o = findOrder(orderId);
const content = layout("Swap Tool", orderId);

if (!o) {
  notFound(content, "Open an order from the queue to use the swap tool.");
} else {
  const q = `?order=${encodeURIComponent(o.id)}`;
  const saved = Edits.get(o.id);

  let checklist = checklistPanel(o, "prescriber");
  function refreshChecklist() {
    const next = checklistPanel(o, "prescriber");
    checklist.replaceWith(next);
    checklist = next;
  }

  content.append(
    el("h2", { class: "page-title" }, "Swap Tool"),
    tabs(o.id, "Rx / Swap"),
    checklist,
    el("section", { class: "panel" },
      el("header", {}, `Order ${o.id} · ${o.customer.name}`),
      el("div", { class: "body" },
        (() => {
          const p = effectivePrescriber(o);
          return p
            ? el("div", {}, el("span", { class: "muted" }, "Current prescriber: "),
                 el("b", {}, p.name), " — ", p.clinic)
            : el("div", { class: "notice" }, "No prescriber is assigned to this order yet.");
        })())));

  /* ---------- swap prescriber ---------- */
  const kinds = ["Domestic", "Military", "International"];
  const boxes = kinds.map(k => el("input", { type: "checkbox", value: k, checked: k === "Domestic" ? "checked" : null }));
  const searchBy = el("select", { id: "ecpBy" },
    el("option", {}, "Prescriber Name"), el("option", {}, "Clinic"),
    el("option", {}, "Phone"), el("option", {}, "NPI"));
  const searchFor = el("input", { type: "text", id: "ecpFor", placeholder: "Leave blank to list all" });
  const ecpResults = el("div", { id: "ecpResults" });

  function findPrescribers() {
    const allowed = boxes.filter(b => b.checked).map(b => b.value);
    const t = searchFor.value.trim().toLowerCase();
    const key = { "Prescriber Name": "name", "Clinic": "clinic", "Phone": "phone", "NPI": "npi" }[searchBy.value];
    const hits = PRESCRIBER_DIRECTORY.filter(d =>
      allowed.includes(d.kind) && (!t || String(d[key]).toLowerCase().includes(t)));

    ecpResults.replaceChildren();
    if (!allowed.length) { ecpResults.append(el("div", { class: "notice" }, "Select at least one prescriber category.")); return; }
    if (!hits.length) { ecpResults.append(el("div", { class: "notice" }, "No prescribers matched that search.")); return; }

    ecpResults.append(el("table", { class: "grid", style: "margin-top:10px" },
      el("thead", {}, el("tr", {}, el("th", {}, "Name"), el("th", {}, "Clinic"),
        el("th", {}, "Location"), el("th", {}, "Phone"), el("th", {}, "NPI"),
        el("th", {}, "Category"), el("th", {}, ""))),
      el("tbody", {}, ...hits.map(d => el("tr", {},
        el("td", {}, d.name), el("td", {}, d.clinic), el("td", {}, d.city),
        el("td", { class: "mono" }, d.phone), el("td", { class: "mono" }, d.npi),
        el("td", {}, badge(d.kind, d.kind === "Domestic" ? "info" : "grey")),
        el("td", {}, el("button", { class: "btn sm primary", onclick: () => {
          Edits.merge(o.id, {
            prescriberName: d.name, prescriberClinic: d.clinic,
            prescriberPhone: d.phone, prescriberNpi: d.npi
          });
          toast(`Prescriber swapped to ${d.name}.`, "ok");
          setTimeout(() => location.reload(), 700);
        } }, "Select")))))));
  }

  searchFor.addEventListener("keydown", e => { if (e.key === "Enter") findPrescribers(); });

  content.append(el("section", { class: "panel" },
    el("header", {}, "Swap Prescriber For This Rx"),
    el("div", { class: "body" },
      el("div", { style: "margin-bottom:10px" },
        ...kinds.map((k, i) => el("label", { class: "check" }, boxes[i], k))),
      el("div", { class: "formgrid" },
        el("label", { for: "ecpBy" }, "Search by"), searchBy,
        el("label", { for: "ecpFor" }, "Search for"), searchFor),
      el("div", { class: "btnrow" },
        el("button", { class: "btn primary", onclick: findPrescribers }, "Search"),
        el("button", { class: "btn", onclick: () => {
          Edits.merge(o.id, {
            prescriberName: "", prescriberClinic: "", prescriberPhone: "", prescriberNpi: ""
          });
          toast("Reverted to the prescriber on file.", "ok");
          setTimeout(() => location.reload(), 700);
        } }, "Revert To Original")),
      ecpResults)));

  /* ---------- fill out an item ---------- */
  const it = {
    eye:   el("select", { id: "iEye" }, el("option", {}, "OD"), el("option", {}, "OS"), el("option", {}, "OU")),
    item:  el("select", { id: "iItem" }, el("option", { value: "" }, "Select ———"), ...LENS_CATALOG.map(v => el("option", {}, v))),
    qty:   el("input", { type: "number", id: "iQty", value: "1", min: "1", max: "24" }),
    power: el("input", { type: "text", id: "iPower", placeholder: "-4.75" }),
    bc:    el("input", { type: "text", id: "iBc", placeholder: "8.40" }),
    dia:   el("input", { type: "text", id: "iDia", placeholder: "14.0" }),
    cyl:   el("input", { type: "text", id: "iCyl", placeholder: "0.00" }),
    axis:  el("input", { type: "text", id: "iAxis", placeholder: "0" }),
    add:   el("input", { type: "text", id: "iAdd", placeholder: "+2.00" }),
    color: el("input", { type: "text", id: "iColor", placeholder: "Optional" })
  };

  /* Copy one prescribed line from the document into the form. */
  function fillFrom(rx, quiet) {
    it.eye.value = rx.eye;
    it.item.value = rx.item;
    it.qty.value = rx.qty;
    it.power.value = rx.power;
    it.bc.value = rx.bc;
    it.dia.value = rx.dia;
    it.cyl.value = rx.cyl;
    it.axis.value = rx.axis;
    it.add.value = rx.add || "";
    it.color.value = rx.color || "";
    if (!quiet) toast(`Loaded the ${rx.eye} line.`);
  }

  /* Prescribed lines not yet on the order, matched on eye + power. */
  function outstandingRx() {
    const have = effectiveItems(o);
    return o.document.rx.filter(rx =>
      !have.some(h => h.eye === rx.eye && h.power === rx.power && h.item === rx.item));
  }

  const rxSource = el("tbody");
  function paintRxSource() {
    rxSource.replaceChildren();
    for (const rx of o.document.rx) {
      const done = !outstandingRx().includes(rx);
      rxSource.append(el("tr", {},
        el("td", {}, rx.eye), el("td", {}, rx.item), el("td", { class: "num" }, rx.qty),
        el("td", { class: "num" }, rx.power), el("td", { class: "num" }, rx.bc),
        el("td", { class: "num" }, rx.dia), el("td", { class: "num" }, rx.cyl),
        el("td", { class: "num" }, rx.axis),
        el("td", {}, done
          ? badge("On order", "ok")
          : el("button", { class: "btn sm primary", onclick: () => fillFrom(rx) }, "Use This"))));
    }
  }
  paintRxSource();

  const preview = el("tbody");
  function paintPreview() {
    const added = AddedItems.get(o.id);
    preview.replaceChildren();
    if (!added.length) {
      preview.append(el("tr", {}, el("td", { colspan: "11", class: "muted", style: "padding:14px;text-align:center" },
        "No items added in this session.")));
      return;
    }
    added.forEach((a, idx) => {
      preview.append(el("tr", { class: "rx-row" },
        el("td", {}, a.eye), el("td", {}, a.item), el("td", { class: "num" }, a.qty),
        el("td", { class: "num" }, a.power), el("td", { class: "num" }, a.bc),
        el("td", { class: "num" }, a.dia), el("td", { class: "num" }, a.cyl),
        el("td", { class: "num" }, a.axis), el("td", { class: "num" }, a.add || "—"),
        el("td", {}, a.color || "—"),
        el("td", {}, el("button", { class: "btn sm warn", type: "button",
          onclick: () => removeItemAt(idx) }, "Remove"))));
    });
  }
  paintPreview();

  /* Start on the first line the order is still missing, so the form is
     never blank when the document already says what is needed. */
  const firstOutstanding = outstandingRx()[0];
  if (firstOutstanding) fillFrom(firstOutstanding, true);

  /* Takes back a single line added in this session. */
  function removeItemAt(idx) {
    const gone = AddedItems.removeAt(o.id, idx);
    paintPreview();
    paintRxSource();
    refreshChecklist();
    toast(gone ? `Removed the ${gone.eye} line.` : "Nothing to remove.");
  }

  /* Takes back every line added in this session. Lines that were already
     on the order before this session are untouched. */
  function removeAllAdded() {
    const n = AddedItems.clear(o.id);
    if (!n) { toast("No items have been added in this session."); return; }
    paintPreview();
    paintRxSource();
    refreshChecklist();
    const next = outstandingRx()[0];
    if (next) fillFrom(next, true);
    toast(`Removed ${n} added line${n === 1 ? "" : "s"}.`);
  }

  /* Adds every prescribed line the order is still missing, in one go. */
  function addAllFromDocument() {
    const pending = outstandingRx();
    if (!pending.length) {
      toast("Every line on the document is already on this order.");
      return;
    }
    for (const rx of pending) {
      AddedItems.add(o.id, {
        eye: rx.eye, item: rx.item, qty: rx.qty, power: rx.power, bc: rx.bc,
        dia: rx.dia, cyl: rx.cyl, axis: rx.axis, add: rx.add || "", color: rx.color || ""
      });
    }
    paintPreview();
    paintRxSource();
    refreshChecklist();
    toast(`Added ${pending.length} line${pending.length === 1 ? "" : "s"} from the document.`, "ok");
  }

  function addItem() {
    if (!it.item.value) { toast("Choose an item from the catalog."); return; }
    if (!it.power.value.trim()) { toast("Power is required."); return; }
    if (!/^[+-]?\d+(\.\d{1,2})?$/.test(it.power.value.trim())) {
      toast("Power must be a number such as -4.75 or +1.25."); return;
    }
    const qty = Number(it.qty.value);
    if (!Number.isInteger(qty) || qty < 1 || qty > 24) { toast("Quantity must be between 1 and 24."); return; }

    AddedItems.add(o.id, {
      eye: it.eye.value, item: it.item.value, qty,
      power: it.power.value.trim(), bc: it.bc.value.trim() || "8.40",
      dia: it.dia.value.trim() || "14.0", cyl: it.cyl.value.trim() || "0.00",
      axis: it.axis.value.trim() || "0", add: it.add.value.trim(), color: it.color.value.trim()
    });
    it.power.value = it.cyl.value = it.axis.value = it.add.value = it.color.value = "";
    paintPreview();
    paintRxSource();
    refreshChecklist();
    const next = outstandingRx()[0];
    if (next) fillFrom(next, true);
    toast("Item added.", "ok");
  }

  /* ---------- edit member ---------- */
  const mf = {
    first: el("input", { type: "text", id: "mFirst", value: saved.memberFirst ?? o.member.first }),
    last:  el("input", { type: "text", id: "mLast",  value: saved.memberLast  ?? o.member.last }),
    dob:   el("input", { type: "text", id: "mDob", value: saved.memberDob ?? o.member.dob,
                         placeholder: DATE_HINT, autocomplete: "off" })
  };

  content.append(el("section", { class: "panel" },
    el("header", {}, "Edit Member"),
    el("div", { class: "body" },
      el("div", { class: "notice" },
        "Changing the member name will modify the order and restart verification."),
      el("div", { class: "formgrid" },
        el("label", { for: "mFirst" }, "First Name"), mf.first,
        el("label", { for: "mLast" }, "Last Name"), mf.last,
        el("label", { for: "mDob" }, "Date of Birth"), mf.dob),
      el("div", { class: "btnrow" },
        el("button", { class: "btn primary", onclick: () => {
          if (!mf.first.value.trim() || !mf.last.value.trim()) { toast("First and last name are required."); return; }
          if (mf.dob.value.trim() && !parseDate(mf.dob.value)) {
            toast(`Date of birth is not a valid date. Use ${DATE_HINT}.`); return;
          }
          Edits.merge(o.id, {
            memberFirst: mf.first.value.trim(),
            memberLast: mf.last.value.trim(),
            memberDob: mf.dob.value.trim() ? fmtDate(parseDate(mf.dob.value)) : ""
          });
          mf.dob.value = Edits.get(o.id).memberDob;
          toast("Member updated. Verification would restart.", "ok");
        } }, "Save Member")))));

  content.append(el("section", { class: "panel" },
    el("header", {}, "Fill Out Item"),
    el("div", { class: "body" },
      el("div", { class: "subhead" }, "As Written On The Document"),
      el("table", { class: "grid", style: "margin-bottom:14px" },
        el("thead", {}, el("tr", {},
          el("th", {}, "Eye"), el("th", {}, "Item"), el("th", { class: "num" }, "Qty"),
          el("th", { class: "num" }, "Power"), el("th", { class: "num" }, "BC"),
          el("th", { class: "num" }, "Dia"), el("th", { class: "num" }, "Cyl"),
          el("th", { class: "num" }, "Axis"), el("th", {}, ""))),
        rxSource),
      el("div", { class: "formgrid" },
        el("label", { for: "iEye" }, "Eye"), it.eye,
        el("label", { for: "iItem" }, "Item"), it.item,
        el("label", { for: "iQty" }, "Quantity"), it.qty,
        el("label", { for: "iPower" }, "Power"), it.power,
        el("label", { for: "iBc" }, "Base Curve"), it.bc,
        el("label", { for: "iDia" }, "Diameter"), it.dia,
        el("label", { for: "iCyl" }, "Cylinder"), it.cyl,
        el("label", { for: "iAxis" }, "Axis"), it.axis,
        el("label", { for: "iAdd" }, "Add Power"), it.add,
        el("label", { for: "iColor" }, "Color"), it.color),
      el("div", { class: "btnrow" },
        el("button", { class: "btn primary", type: "button", onclick: addItem }, "Add Item")),
      el("div", { class: "subhead", style: "margin-top:14px" }, "Items Added This Session"),
      el("table", { class: "grid" },
        el("thead", {}, el("tr", {},
          el("th", {}, "Eye"), el("th", {}, "Item"), el("th", { class: "num" }, "Qty"),
          el("th", { class: "num" }, "Power"), el("th", { class: "num" }, "BC"),
          el("th", { class: "num" }, "Dia"), el("th", { class: "num" }, "Cyl"),
          el("th", { class: "num" }, "Axis"), el("th", { class: "num" }, "Add"),
          el("th", {}, "Color"), el("th", {}, ""))),
        preview))));

  /* ---------- bottom action bar ----------
     Deliberately the last thing in the DOM, so Tab walks straight down to
     it: add every prescribed line, then step once more to leave. */
  content.append(el("div", { class: "bottombar" },
    el("span", { class: "label" }, "Finish up"),
    el("button", { class: "btn warn", type: "button", onclick: removeAllAdded },
      "Remove All Added Items"),
    el("button", { class: "btn primary", type: "button", onclick: addAllFromDocument },
      "Add All Items From Document"),
    el("div", { class: "spacer" }),
    el("a", { class: "btn primary", href: `order.html${q}` }, "Back to Order")));
}
</script>
</body>
</html>
