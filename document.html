<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopilot — Document Viewer</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
const orderId = param("order");
const o = findOrder(orderId);
const content = layout("Document Viewer", orderId);

if (!o) {
  notFound(content, "Open an order from the queue to view its documents.");
} else {
  const saved = Edits.get(o.id);
  const q = `?order=${encodeURIComponent(o.id)}`;
  const c = o.customer, m = o.member;
  const doc = o.document;
  const p = { name: doc.prescriberName, clinic: doc.prescriberClinic,
              phone: doc.prescriberPhone, npi: doc.prescriberNpi };
  const dash = v => v || "—";

  content.append(
    el("h2", { class: "page-title" }, `Document ${o.docId}`),
    tabs(o.id, "Documents"),
    checklistPanel(o, "document"));

  /* ---------- the document, as selectable content ---------- */
  content.append(el("section", { class: "panel noprint" },
    el("header", {}, `Received ${o.received}`,
      el("div", { class: "spacer" }),
      el("a", { href: "#", onclick: e => { e.preventDefault(); window.print(); } }, "Print")),
    el("div", { class: "body" },
      el("div", { class: "notice" },
        "This is the prescription as received. Every value is selectable — highlight it, ",
        "or use the Copy buttons. To keep it beside the order, ",
        el("b", {}, "open it in its own window"), " and drag that to your second screen."),
      el("div", { class: "btnrow", style: "margin-top:0" },
        docWindowBtn(o),
        el("a", { class: "btn", href: `docview.html${q}`, target: "_blank", rel: "noopener" },
          "Open In New Tab"),
        el("span", { class: "muted" },
          "If your browser blocks the pop-up, use the tab version and drag it across.")))));

  documentSections(o, true).forEach(sec => content.append(sec));

  /* ---------- document metadata ---------- */
  content.append(el("section", { class: "panel noprint" },
    el("header", {}, "Document Information"),
    el("div", { class: "body tight" },
      el("table", { class: "grid" },
        el("thead", {}, el("tr", {},
          el("th", {}, "Document ID"), el("th", {}, "Received"), el("th", {}, "Caller ID"),
          el("th", {}, "Type"), el("th", {}, "Linked Order"))),
        el("tbody", {}, el("tr", {},
          el("td", { class: "mono" }, o.docId),
          el("td", { class: "mono" }, o.received),
          el("td", { class: "mono" }, o.callerId === "0"
            ? el("span", { class: "badge err" }, "invalid") : o.callerId),
          el("td", {}, saved.faxType || o.faxType),
          el("td", {}, el("a", { href: `order.html${q}` }, o.id))))))));

  /* ---------- what to transcribe ---------- */
  content.append(el("section", { class: "panel noprint" },
    el("header", {}, "Transcribe From This Document"),
    el("div", { class: "body tight" },
      el("table", { class: "kv" },
        el("tr", {}, el("th", {}, "Dates \u2192 Order screen"),
          el("td", {}, `Exam ${doc.examDate} · Issued ${doc.issueDate} · Expires ${doc.expiresDate}`)),
        el("tr", {}, el("th", {}, "Signature date \u2192 below"), el("td", {}, doc.signatureDate)),
        el("tr", {}, el("th", {}, "Prescriber \u2192 Swap Tool"),
          el("td", {}, `${doc.prescriberName} — ${doc.prescriberClinic}`)),
        el("tr", {}, el("th", {}, "Line items \u2192 Swap Tool"),
          el("td", {}, doc.rx.map(r => `${r.eye} ${r.item} ${r.power}`).join("  ·  ")))))));

  /* ---------- document review (workflow stage 3) ---------- */
  const rv = Review.get(o.id);
  const dr = {
    sigDate: el("input", { type: "text", id: "sigDate", value: rv.docSignatureDate || "",
                           placeholder: DATE_HINT, autocomplete: "off" }),
    quality: el("select", { id: "docQuality" },
      el("option", { value: "" }, "Select ———"),
      ...["Legible", "Partially legible", "Illegible"].map(v =>
        el("option", { value: v, selected: v === rv.docQuality ? "selected" : null }, v))),
    sigPresent: el("input", { type: "checkbox", id: "sigPresent", checked: rv.docSigPresent || null }),
    nameMatch:  el("input", { type: "checkbox", id: "nameMatch", checked: rv.docNameMatch || null })
  };

  const drStatus = el("div");
  function paintDrStatus() {
    drStatus.replaceChildren(Review.get(o.id).docReviewed
      ? el("div", { class: "notice ok" }, "Document reviewed. Stage 3 of 5 complete.")
      : el("div", { class: "notice" }, "This document has not been reviewed yet."));
  }
  paintDrStatus();

  function markReviewed() {
    const dt = parseDate(dr.sigDate.value);
    if (!dr.sigDate.value.trim()) { toast("Enter the signature date from the document."); return; }
    if (!dt) { toast(`Signature date is not a valid date. Use ${DATE_HINT}.`); return; }
    if (dt > today()) { toast("Signature date cannot be in the future."); return; }
    if (!dr.quality.value) { toast("Select the document quality."); return; }
    if (dr.quality.value === "Illegible") {
      toast("An illegible document cannot be accepted. Request a new copy from the prescriber.");
      return;
    }
    if (!dr.sigPresent.checked || !dr.nameMatch.checked) {
      toast("Confirm both the signature and the patient name before marking the document reviewed.");
      return;
    }
    dr.sigDate.value = fmtDate(dt);
    Review.merge(o.id, {
      docReviewed: true, docSignatureDate: fmtDate(dt), docQuality: dr.quality.value,
      docSigPresent: true, docNameMatch: true
    });
    paintDrStatus();
    toast("Document marked as reviewed.", "ok");
  }

  content.append(el("section", { class: "panel noprint" },
    el("header", {}, "Document Review"),
    el("div", { class: "body" },
      drStatus,
      el("div", { class: "formgrid" },
        el("label", { for: "sigDate" }, "Signature Date"), dr.sigDate,
        el("label", { for: "docQuality" }, "Document Quality"), dr.quality,
        el("label", {}, "Confirmations"),
        el("div", { class: "full" },
          el("label", { class: "check" }, dr.sigPresent, "Prescriber signature present"),
          el("label", { class: "check" }, dr.nameMatch, "Patient name matches the order"))),
      el("div", { class: "btnrow" },
        el("button", { class: "btn primary", onclick: markReviewed }, "Mark Document Reviewed"),
        el("a", { class: "btn", href: `swap.html${q}` }, "Next: Swap Tool"),
        el("button", { class: "btn", onclick: () => {
          Review.merge(o.id, { docReviewed: false }); paintDrStatus(); toast("Document review cleared.");
        } }, "Clear Review")))));

  /* ---------- search options ---------- */
  const byField = el("select", { id: "searchBy" }, ...SEARCH_FIELDS.map(s => el("option", {}, s)));
  const forTerm = el("input", { type: "text", id: "searchFor", placeholder: "Enter a value" });
  const results = el("div", { id: "results" });

  function runSearch() {
    const hits = searchOrders(byField.value, forTerm.value);
    results.replaceChildren();
    if (!forTerm.value.trim()) { toast("Enter a value to search for."); return; }
    if (!hits.length) {
      results.append(el("div", { class: "notice" },
        `No orders matched ${byField.value} "${forTerm.value}".`));
      return;
    }
    if (hits.length === 1) { location.href = `order.html?order=${encodeURIComponent(hits[0].id)}`; return; }
    const tb = el("tbody", {}, ...hits.map(h => el("tr", {
        class: "clickable",
        onclick: () => location.href = `order.html?order=${encodeURIComponent(h.id)}`
      },
      el("td", { class: "mono" }, h.id), el("td", {}, h.customer.name),
      el("td", { class: "mono" }, h.customerId), el("td", {}, badge(h.status, h.statusKind)))));
    results.append(el("table", { class: "grid", style: "margin-top:10px" },
      el("thead", {}, el("tr", {}, el("th", {}, "Order"), el("th", {}, "Customer"),
        el("th", {}, "Customer ID"), el("th", {}, "Status"))), tb));
  }

  forTerm.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

  content.append(el("section", { class: "panel noprint" },
    el("header", {}, "Search Options"),
    el("div", { class: "body" },
      el("div", { class: "formgrid" },
        el("label", { for: "searchBy" }, "Search by"), byField,
        el("label", { for: "searchFor" }, "Search for"), forTerm),
      el("div", { class: "btnrow" },
        el("button", { class: "btn primary", onclick: runSearch }, "Search"),
        el("a", { class: "btn", href: `order.html${q}` }, "Back to Order"),
        el("a", { class: "btn", href: "index.html" }, "Back to Queue")),
      el("p", { class: "muted", style: "margin:10px 0 0" },
        "When searching by member name, use the format ", el("b", {}, "last, first"), "."),
      results)));
}
</script>
</body>
</html>
